baseURL = "https://zhi.moe/"
title = "香取海"
locale = "zh" # v0.158.0+ languageCode 改为 locale
defaultContentLanguage = "zh"
theme = "paged"

enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true

[sitemap]
filename = "sitemap.xml"
changefreq = "weekly"
priority = 0.5


[outputs]
home = [ "html", "rss", "json" ]

[minify]
minifyOutput = true


# Enable .GitInfo object for each page (if the Hugo site is versioned by Git)
# This will then update the Lastmod parameter for each page using the last git commit date for that content file
enableGitInfo = true

[markup.highlight]
codeFences = true
guessSyntax = true
style = "xcode"

[markup.goldmark.extensions.footnote]
backlinkHTML = "↩︎"

[markup.goldmark.renderer]
hardWraps = true # 回车换行无需空行
unsafe = true
xhtml = false

# v0.158.0+ 默认禁止 content/ 下的 .html 文件作为页面内容
# 注意：该列表是 allowlist, 需要同时保留站点用到的 text/markdown
[security]
allowContent = ['^text/html$', '^text/markdown$']
